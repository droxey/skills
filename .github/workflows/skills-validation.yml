name: skills-validation

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: validate-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==9.1.1
      - name: Validate manifest
        run: python -m json.tool skills-manifest.json
      - name: Validate skill contracts
        run: python tools/validate_skills.py
      - name: Run tests
        run: python -m pytest -q
